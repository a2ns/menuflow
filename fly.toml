# fly.toml app configuration file generated for menuflow on 2026-10-11T09:21:10Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'menuflow'
primary_region = 'fra'

[build]

[env]
  DATA_DIR = '/data'

[[mounts]]
  source = 'menuflow_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/api/settings'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
